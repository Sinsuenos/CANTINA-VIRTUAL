<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sinaloa Sueños</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;900&display=swap');
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'DM Sans', sans-serif;
        background: #070b14;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      main { max-width: 540px; margin: 0 auto; padding: 3rem 1.25rem; }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.75rem;
      }
      .brand img {
        width: 36px; height: 36px;
        border-radius: 50%;
        object-fit: cover;
      }
      .brand h1 {
        font-size: 0.9rem;
        font-weight: 700;
        color: #fff;
      }
      .brand h1 em { font-style: normal; color: #d946ef; }

      .block {
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        min-height: 340px;
      }
      .block-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      .block-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(to bottom, rgba(7,11,20,0.3) 0%, rgba(7,11,20,0.85) 50%, rgba(7,11,20,0.95) 100%);
      }
      .block-body {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 340px;
        padding: 2rem;
      }
      .block-body h2 {
        font-size: 1.85rem;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.03em;
        line-height: 1.12;
        margin-bottom: 1.25rem;
        text-shadow: 0 2px 30px rgba(0,0,0,0.5);
      }
      .block-body p {
        font-size: 0.95rem;
        color: rgba(255,255,255,0.7);
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }
      .btn {
        display: inline-block;
        width: fit-content;
        padding: 0.75rem 1.6rem;
        background: #d946ef;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 700;
        border-radius: 8px;
      }
      .btn:hover { background: #fde047; color: #070b14; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="https://public-files.gumroad.com/tabcyhdgrnbv8i7gkeopz6rrylxf" alt="">
        <h1>Sinaloa <em>Sueños</em></h1>
      </div>

      <a href="https://sinaloainspired.gumroad.com/l/nectar-engine">
        <div class="block">
          <img class="block-bg" src="https://public-files.gumroad.com/1tv186hbt4m694h32fw9musnaqal" alt="">
          <div class="block-overlay"></div>
          <div class="block-body">
            <h2>We turn one affiliate offer into platform-ready campaigns.</h2>
            <p>$47 &middot; 9 publishing environments &middot; Less prompting, more producing.</p>
            <span class="btn">Get Nectar Engine &rarr;</span>
          </div>
        </div>
      </a>
    </main>
  </body>
</html>
